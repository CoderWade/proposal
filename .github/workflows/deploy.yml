name: Sync proposals and deploy site

on:
  schedule:
    # Every 6 hours. GitHub cron is UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Clear the translation cache and re-translate everything"
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - "site/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # data/cache/translations.json is committed, so the cache survives
      # without actions/cache and scheduled runs only pay for new proposals.
      - name: Fetch, translate, build
        env:
          TRANSLATE_WORKERS: "6"
        run: |
          if [ "${{ inputs.full_refresh }}" = "true" ]; then
            rm -f data/cache/translations.json
          fi
          python scripts/pipeline.py --refresh
          python scripts/check_site.py

      - name: Commit updated translation cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache
          if git diff --staged --quiet; then
            echo "No new translations."
            exit 0
          fi
          git commit -m "chore(data): update translation cache $(date -u +%Y-%m-%dT%H:%MZ)"
          # A protected branch or a concurrent push must not block the deploy.
          git push || echo "::warning::could not push the translation cache; deploying anyway"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
