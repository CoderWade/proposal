name: Validate pipeline

on:
  pull_request:
    paths:
      - "scripts/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse sources and build without network translation
        run: |
          python scripts/fetch.py
          python scripts/translate.py --no-translate
          python scripts/build_site.py
          python scripts/check_site.py
