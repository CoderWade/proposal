<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <!-- Theme must be resolved before first paint: an inline, render-blocking
       script in <head> prevents a flash of the default dark theme for
       visitors who chose light. Keep it tiny and synchronous. -->
  <script>
    try {
      var saved = localStorage.getItem("proposal-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.dataset.theme = saved;
      }
    } catch (e) {}
  </script>
